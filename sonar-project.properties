sonar.projectKey=buscaminas-tripartito
sonar.projectName=Buscaminas Tripartito
sonar.sourceEncoding=UTF-8
sonar.sources=client/src,server
sonar.exclusions=server/test/**,client/src/assets/**,**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/.sonar/**,**/.scannerwork/**
sonar.tests=server/test,cypress
sonar.test.inclusions=server/test/**/*.test.js,cypress/**/*.cy.js
sonar.javascript.lcov.reportPaths=server/coverage/lcov.info
# SonarJS S2699 does not recognize assertions from Node's built-in node:assert/strict.
# Scope this false-positive suppression to the Node test files, never production code.
sonar.issue.ignore.multicriteria=nodeTestAssertions
sonar.issue.ignore.multicriteria.nodeTestAssertions.ruleKey=javascript:S2699
sonar.issue.ignore.multicriteria.nodeTestAssertions.resourceKey=server/test/**/*.test.js
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
